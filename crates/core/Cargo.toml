[package]
name = "mdwell-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Independent, local-first Markdown workspace and search core"


[dependencies]
ammonia = "4"
getrandom = "0.4"
pulldown-cmark = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
url = "2"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
serde_json = "1"

# The fixture executable also dispatches the production credential helper entry point.
[[test]]
name = "oauth"
harness = false
